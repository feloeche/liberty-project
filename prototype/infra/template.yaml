AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Ágil (demo): one Lambda serves the static web and the collections agent API
  behind an HTTP API; state in a DynamoDB table; the model on Amazon Bedrock.

Parameters:
  DemoToken:
    Type: String
    NoEcho: true
    MinLength: 8
    Description: Token the web sends in x-demo-token (shared in the URL ?t=...).
  LlmProvider:
    Type: String
    Default: bedrock
    AllowedValues: [bedrock, mock]
    Description: mock = offline rule engine (no model cost).
  BedrockModelId:
    Type: String
    Default: us.anthropic.claude-sonnet-4-6
    Description: Cross-region inference profile for Claude on Bedrock.
  Effort:
    Type: String
    Default: low
    AllowedValues: [low, medium, high]
    Description: Model effort. low because of the HTTP API 30 s per-request cap.
  AgilToday:
    Type: String
    Default: ""
    Description: Fixed business date (YYYY-MM-DD) for a reproducible demo; empty = today.
  ScheduledCampaign:
    Type: String
    Default: DISABLED
    AllowedValues: [DISABLED, ENABLED]
    Description: Daily proactive contact campaign. Off by default so the demo doesn't send on its own.

Resources:
  # State: promises, payment plans, links, cases, sessions (TTL) and audit. On-demand:
  # no traffic, no capacity cost.
  AgilTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  AgilLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}
      RetentionInDays: 14

  AgilApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      # Cost and abuse brake: the token alone doesn't stop bursts against the model.
      DefaultRouteSettings:
        ThrottlingRateLimit: 5
        ThrottlingBurstLimit: 10

  AgilFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .build/app        # built by `make build` (code + web + ARM64 dependencies)
      Handler: agil.api.lambda_handler
      Runtime: python3.12
      Architectures: [arm64]
      MemorySize: 1024           # more memory = more CPU: shortens the cold start
      Timeout: 60                # one turn may chain several model calls
      LoggingConfig:
        LogGroup: !Ref AgilLogs
      Environment:
        Variables:
          AGIL_BACKEND: aws
          AGIL_TABLE: !Ref AgilTable
          AGIL_DEMO_TOKEN: !Ref DemoToken
          LLM_PROVIDER: !Ref LlmProvider
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          AGIL_EFFORT: !Ref Effort
          AGIL_TODAY: !Ref AgilToday
          AGIL_LLM_TIMEOUT: "25"
      Policies:
        - DynamoDBCrudPolicy:     # scoped to THIS table
            TableName: !Ref AgilTable
        - Statement:
            - Effect: Allow
              Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
              Resource:
                # The us.* inference profile routes to models in several US regions,
                # hence the wildcard region on the foundation-model.
                - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.anthropic.*
                - arn:aws:bedrock:*::foundation-model/anthropic.*
      Events:
        All:
          Type: HttpApi          # no Path/Method = $default route: the Lambda routes
          Properties:
            ApiId: !Ref AgilApi

  # Proactive contact: EventBridge Scheduler invokes the SAME Lambda with its own
  # event ({"action":"daily_campaign"}); the suppression rules run in code.
  # In production the customer list would come from an Athena query over the
  # data lake (proposal, §4.2) and messages would go out via End User Messaging Social.
  DailyCampaign:
    Type: AWS::Scheduler::Schedule
    Properties:
      Description: Daily notice campaign (Monday to Saturday, 9:00 Panama time)
      ScheduleExpression: cron(0 9 ? * MON-SAT *)
      ScheduleExpressionTimezone: America/Panama
      FlexibleTimeWindow: { Mode: "OFF" }
      State: !Ref ScheduledCampaign
      Target:
        Arn: !GetAtt AgilFunction.Arn
        RoleArn: !GetAtt CampaignRole.Arn
        Input: '{"action": "daily_campaign"}'

  # Least privilege: Scheduler can only invoke this function.
  CampaignRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { aws:SourceAccount: !Ref AWS::AccountId }
      Policies:
        - PolicyName: invoke-agil
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt AgilFunction.Arn

Outputs:
  Url:
    Description: Demo URL (append ?t=<DemoToken> the first time)
    Value: !Sub https://${AgilApi}.execute-api.${AWS::Region}.amazonaws.com/
  Table:
    Value: !Ref AgilTable
