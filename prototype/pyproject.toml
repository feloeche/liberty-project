[project]
name = "agil"
version = "0.1.0"
description = "Conversational collections agent prototype (Proyecto Ágil, LLA Panama)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.0",
    "rich>=13.7",
]

[project.optional-dependencies]
# Bedrock (AWS path): SigV4 signing with AWS credentials
bedrock = ["anthropic[bedrock]>=2.0"]

[dependency-groups]
dev = [
    "moto[dynamodb]>=5",
    "pytest>=8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
